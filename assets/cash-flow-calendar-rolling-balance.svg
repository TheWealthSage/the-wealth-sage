<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Example of a rolling cash flow calendar balance</title>
<desc id="desc">A cash flow example starts with 900 dollars. Weekly ending balances are 990, 1390, 1210, and 1490 dollars after recording actual income and expenses.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111719"/><stop offset="1" stop-color="#07090b"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2d697"/><stop offset="1" stop-color="#a77c3c"/></linearGradient></defs>
<rect width="1200" height="640" fill="url(#bg)"/>
<text x="65" y="72" fill="#c7a66a" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ROLLING BALANCE • ILLUSTRATIVE EXAMPLE</text>
<text x="65" y="128" fill="#f1ecdf" font-family="Georgia,serif" font-size="39" font-weight="700">Every week carries into the next.</text>
<text x="66" y="165" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="16">Opening available balance: $900 • All amounts are illustrative</text>
<path d="M85 493H1125" stroke="#454b47" stroke-width="2"/>
<g transform="translate(105 0)">
  <rect x="0" y="322" width="165" height="171" rx="8" fill="url(#gold)" opacity=".9"/>
  <text x="82" y="300" text-anchor="middle" fill="#f2eee6" font-family="Georgia,serif" font-size="30" font-weight="700">$990</text>
  <text x="82" y="529" text-anchor="middle" fill="#c7a66a" font-family="Arial,sans-serif" font-size="15" font-weight="700">WEEK 1</text>
  <text x="82" y="555" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">+$1,400 income</text>
  <text x="82" y="578" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">−$1,310 expenses</text>

  <rect x="250" y="255" width="165" height="238" rx="8" fill="url(#gold)" opacity=".94"/>
  <text x="332" y="233" text-anchor="middle" fill="#f2eee6" font-family="Georgia,serif" font-size="30" font-weight="700">$1,390</text>
  <text x="332" y="529" text-anchor="middle" fill="#c7a66a" font-family="Arial,sans-serif" font-size="15" font-weight="700">WEEK 2</text>
  <text x="332" y="555" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">+$700 income</text>
  <text x="332" y="578" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">−$300 expenses</text>

  <rect x="500" y="286" width="165" height="207" rx="8" fill="url(#gold)" opacity=".86"/>
  <text x="582" y="264" text-anchor="middle" fill="#f2eee6" font-family="Georgia,serif" font-size="30" font-weight="700">$1,210</text>
  <text x="582" y="529" text-anchor="middle" fill="#c7a66a" font-family="Arial,sans-serif" font-size="15" font-weight="700">WEEK 3</text>
  <text x="582" y="555" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">$0 new income</text>
  <text x="582" y="578" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">−$180 expenses</text>

  <rect x="750" y="239" width="165" height="254" rx="8" fill="url(#gold)"/>
  <text x="832" y="217" text-anchor="middle" fill="#f2eee6" font-family="Georgia,serif" font-size="30" font-weight="700">$1,490</text>
  <text x="832" y="529" text-anchor="middle" fill="#c7a66a" font-family="Arial,sans-serif" font-size="15" font-weight="700">WEEK 4</text>
  <text x="832" y="555" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">+$600 income</text>
  <text x="832" y="578" text-anchor="middle" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">−$320 expenses</text>
</g>
<rect x="65" y="205" width="1068" height="1" fill="#c7a66a" opacity=".16"/>
<text x="1135" y="620" text-anchor="end" fill="#7f8580" font-family="Arial,sans-serif" font-size="12">Week 1 ending balance becomes Week 2 starting balance, and so on.</text>
</svg>