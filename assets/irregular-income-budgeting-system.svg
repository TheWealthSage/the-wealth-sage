<text x="68" y="602" fill="#c7a66a" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RECEIVED INCOME  →  BASELINE PLAN  →  CASH BUFFER  →  REGULAR REVIEW</text>
<text x="68" y="638" fill="#777b78" font-family="Arial,sans-serif" font-size="12">Illustrative educational framework. Your baseline should reflect your own net income and essential costs.</text>
