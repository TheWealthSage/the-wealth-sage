<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A four-step system for budgeting with irregular income</title>
<desc id="desc">Track take-home income, set a conservative monthly baseline, build a buffer in stronger months, and use it to smooth lower-income months.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101719"/><stop offset="1" stop-color="#07090b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d697"/><stop offset=".55" stop-color="#c7a66a"/><stop offset="1" stop-color="#8b642c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1000" cy="70" r="260" fill="#c7a66a" opacity=".06" filter="url(#glow)"/>
<path d="M0 560H1200" stroke="#c7a66a" stroke-opacity=".18"/>
<text x="68" y="82" fill="#c7a66a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">THE WEALTH SAGE • MONEY SYSTEMS</text>
<text x="68" y="148" fill="#f1ecdf" font-family="Georgia,serif" font-size="43" font-weight="700">When income changes,</text>
<text x="68" y="202" fill="#f1ecdf" font-family="Georgia,serif" font-size="43" font-weight="700">keep the plan steady.</text>
<text x="70" y="244" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="18">A practical framework for variable pay and uneven months</text>

