  <text x="42" y="50" text-anchor="middle" fill="#f2d697" font-family="Arial,sans-serif" font-size="21" font-weight="700">1</text>
  <path d="M30 115H65M30 130H88M30 145H75" stroke="#d8d0c1" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <rect x="145" y="102" width="22" height="48" rx="3" fill="#8d7246"/>
  <rect x="175" y="82" width="22" height="68" rx="3" fill="#b58b4f"/>
  <rect x="205" y="58" width="22" height="92" rx="3" fill="url(#gold)"/>
  <text x="28" y="178" fill="#f2eee6" font-family="Arial,sans-serif" font-size="18" font-weight="700">Track net income</text>
  <text x="28" y="199" fill="#a9aaa5" font-family="Arial,sans-serif" font-size="13">Review the last 6 months</text>
</g>
